name: CSharp ServiceDesk
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build ServiceDesk.sln -c Release
      - run: dotnet run --project Code/Verification -c Release --no-build --no-launch-profile -- . RunResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ServiceDesk-verification
          path: RunResults/
